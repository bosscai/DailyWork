<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Form</title>
    <style>
        .form-container {
            margin: 20px;
        }
        .input-container {
            display: flex;
            margin-bottom: 10px;
        }
        .input-container input:first-child {
            width: 600px;
            margin-right: 10px;
        }
        .radio-container {
            display: flex;
            margin-left: 10px;
        }
        .radio-container input[type="radio"] {
            width: 15px;
            height: 15px;
            vertical-align: middle;
        }
        .radio-container label {
            display: flex;
            align-items: center;
        }
        .submit-button {
            display: block;
            margin: 20px auto;
            width: 200px;
            height: 40px;
            font-size: 18px;
        }
        .input-container button {
            margin-left: 20px;
        }
        .progress-input {
            width: 100px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Dynamic Form</h2>
    <form id="myForm" action="/submit" method="post">
        <div>
            <div id="requestFields">
                <div class="input-container">
                    <input type="text" name="requestInput[]" placeholder="Enter value">
                    <input type="text" name="requestProgress[]" class="progress-input" placeholder="进度(%)" oninput="validateProgressInput(this)">
                    <button type="button" onclick="removeInput(this)">Remove</button>
                </div>
            </div>
            <button type="button" onclick="addRequest()">增加需求</button>
        </div>
        <div>
            <div id="taskFields">
                <div class="input-container">
                    <input type="text" name="taskInput[]" placeholder="Enter value">
                    <input type="text" name="taskProgress[]" class="progress-input" placeholder="进度(%)" oninput="validateProgressInput(this)">
                    <button type="button" onclick="removeInput(this)">Remove</button>
                </div>
            </div>
            <button type="button" onclick="addTask()">增加任务</button>
        </div>
        <div>
            <div id="bugFields">
                <div class="input-container">
                    <input type="text" name="bugInput[]" placeholder="Enter value">
                    <div class="radio-container">
                        <label><input type="radio" name="actions[]" value="修复" style="margin-right: 5px;">修复</label>
                        <label><input type="radio" name="actions[]" value="流转">流转</label>
                    </div>
                    <button type="button" onclick="removeInput(this)">Remove</button>
                </div>
            </div>
            <button type="button" onclick="addBug()">增加缺陷</button>
        </div>

    </form>
    <button type="submit" form="myForm" class="submit-button">Submit</button>
</div>

<script>
    function addRequest() {
        var inputContainer = document.createElement('div');
        inputContainer.className = 'input-container';

        var input = document.createElement('input');
        input.type = 'text';
        input.name = 'requestInput[]';
        input.placeholder = 'Enter value';

        var progressInput = document.createElement('input');
        progressInput.type = 'text';
        progressInput.name = 'requestProgress[]'
        progressInput.className = 'progress-input';
        progressInput.placeholder = '进度(%)';
        progressInput.oninput = function() {
            validateProgressInput(this);
        };

        var removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.onclick = function() {
            removeInput(this);
        };

        inputContainer.appendChild(input);
        inputContainer.appendChild(progressInput);
        inputContainer.appendChild(removeButton);

        document.getElementById('requestFields').appendChild(inputContainer);
    }

    function addTask() {
        var inputContainer = document.createElement('div');
        inputContainer.className = 'input-container';

        var input = document.createElement('input');
        input.type = 'text';
        input.name = 'taskInput[]';
        input.placeholder = 'Enter value';

        var progressInput = document.createElement('input');
        progressInput.type = 'text';
        progressInput.className = 'progress-input';
        progressInput.name = 'taskProgress[]'
        progressInput.placeholder = '进度(%)';
        progressInput.oninput = function() {
            validateProgressInput(this);
        };

        var removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.onclick = function() {
            removeInput(this);
        };

        inputContainer.appendChild(input);
        inputContainer.appendChild(progressInput);
        inputContainer.appendChild(removeButton);

        document.getElementById('taskFields').appendChild(inputContainer);
    }

    function addBug() {
        var inputContainer = document.createElement('div');
        inputContainer.className = 'input-container';

        var input = document.createElement('input');
        input.type = 'text';
        input.name = 'bugInput[]';
        input.placeholder = 'Enter value';

        var radioContainer = document.createElement('div');
        radioContainer.className = 'radio-container';

        var radio1 = document.createElement('label');
        radio1.innerHTML = '<input type="radio" name="actions[]" value="修复" style="margin-right: 5px;">修复';
        var radio2 = document.createElement('label');
        radio2.innerHTML = '<input type="radio" name="actions[]" value="流转">流转';

        var removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.onclick = function() {
            removeInput(this);
        };

        inputContainer.appendChild(input);
        radioContainer.appendChild(radio1);
        radioContainer.appendChild(radio2);
        inputContainer.appendChild(radioContainer);
        inputContainer.appendChild(removeButton);

        document.getElementById('bugFields').appendChild(inputContainer);
    }


    function removeInput(button) {
        var inputContainer = button.parentNode;
        inputContainer.parentNode.removeChild(inputContainer);
    }

    function validateProgressInput(input) {
        var value = input.value;
        // 只允许输入数字和空字符串
        value = value.replace(/[^0-9]/g, '');
        if (value === '') {
            input.value = '';
        } else {
            value = parseInt(value);
            if (value < 0) {
                value = 0;
            } else if (value > 100) {
                value = 100;
            }
            input.value = value.toString();
        }
    }
</script>
</body>
</html>
